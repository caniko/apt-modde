---
# Generated by simit. Manual edits will be reported as ci=drift.
name: Publish apt repository Pages site

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/dists _site/pool
          cp -a dists/. _site/dists/
          cp -a pool/. _site/pool/
          test -s key.gpg.asc
          cp key.gpg.asc _site/
      - name: Deploy Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://apt.modde.tartanoglu.com
          server: codeberg.page
          token: ${{ forge.token }}
          source: _site/
